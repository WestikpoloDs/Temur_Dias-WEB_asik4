<main class="container my-4">
<h1 class="h3 mb-3">Task 1. Form with HTML5 Validation</h1>
<form action="#" method="post">
  <p>
    <label for="name">Name (required, 2-50 characters)</label><br>
    <input type="text" id="name" name="name" required minlength="2" maxlength="50">
  </p>
  <p>
    <label for="email">Email (required, valid format)</label><br>
    <input type="email" id="email" name="email" required maxlength="100">
  </p>
  <p>
    <label for="message">Message (required, max 300 characters)</label><br>
    <textarea id="message" name="message" rows="5" cols="40" required minlength="10" maxlength="300"></textarea>
  </p>
  <button type="submit">Submit</button>
</form>
<p class="mt-3 text-muted">Try submitting an empty form, an email without "@", or a too short name/message - the browser blocks submission and shows a message.</p>
</main>
